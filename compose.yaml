services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catms-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8000
    ports:
      - "${PORT:-8000}:8000"
