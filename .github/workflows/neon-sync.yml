name: Neon sync

on:
  push:
    branches: [main]
    paths:
      - 'database/**'
      - 'scripts/check_neon.py'
      - '.github/workflows/neon-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neon-sync
  cancel-in-progress: false

jobs:
  verify:
    name: Verify current SQL on disposable PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: catms
          POSTGRES_PASSWORD: catms
          POSTGRES_DB: catms
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U catms -d catms"
          --health-interval 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: catms
      PGPASSWORD: catms
      PGDATABASE: catms
    steps:
      - uses: actions/checkout@v4
      - name: Initialize disposable database prerequisites
        run: |
          psql -v ON_ERROR_STOP=1 -q -f database/01_database.sql
          psql -v ON_ERROR_STOP=1 -q -c 'CREATE EXTENSION IF NOT EXISTS pgcrypto;'
      - name: Build and check a fresh schema
        shell: bash
        run: |
          set -euo pipefail
          for file in database/0[2-9]_*.sql database/10_*.sql; do
            echo "Checking $file on disposable PostgreSQL"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Verify the latest integrity migration against current schema
        run: psql -v ON_ERROR_STOP=1 -q -f database/migrations/20261012_original_brief_integrity.sql

  neon:
    name: Check Neon connectivity and migration status (read-only)
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: neon
    env:
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      NEON_DATABASE_NAME: neondb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PostgreSQL client
        run: python -m pip install 'psycopg[binary]>=3.2,<4'
      - name: Verify live schema without replaying historical SQL
        run: python scripts/check_neon.py
